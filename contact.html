<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Auto Rent</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <style>
        body {
            background: #f4f7fb;
            color: #263445;
            font-family: Arial, sans-serif;
        }

        .navbar,
        footer {
            background: #102a43;
        }

        main {
            max-width: 850px;
        }

        .contact-card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 8px 24px #102a430f;
        }

        h1 {
            color: #102a43;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index3.html">AUTO RENT</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index3.html">Accueil</a>
                <a class="nav-link active" href="contact.html">Contact</a>
                <a class="nav-link" href="devis.html">Devis</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="mb-2">Contactez-nous</h1>
        <p class="text-secondary mb-4">
            Une question sur une location ? Envoyez-nous votre demande.
        </p>

        <form id="formContact" class="contact-card card card-body p-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nom" class="form-label">Nom et prénom</label>
                    <input type="text"
                           class="form-control"
                           id="nom"
                           minlength="3"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">Adresse email</label>
                    <input type="email"
                           class="form-control"
                           id="email"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="telephone" class="form-label">Téléphone</label>
                    <input type="tel"
                           class="form-control"
                           id="telephone"
                           required>
                </div>

                <div class="col-md-6">
                    <label for="sujet" class="form-label">Sujet</label>
                    <select class="form-select" id="sujet" required>
                        <option value="">Choisir un sujet</option>
                        <option value="reservation">Question sur une réservation</option>
                        <option value="vehicule">Question sur un véhicule</option>
                        <option value="autre">Autre demande</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control"
                              id="message"
                              rows="5"
                              minlength="10"
                              required></textarea>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary">
                        Envoyer
                    </button>
                </div>

                <div class="col-12">
                    <p id="confirmation" class="mb-0" aria-live="polite"></p>
                </div>
            </div>
        </form>
    </main>

    <footer class="text-light text-center py-3">
        <p class="mb-0">© 2026 Auto Rent — Agence de location de voitures</p>
    </footer>

    <script>
        document
            .getElementById("formContact")
            .addEventListener("submit", function (event) {
                event.preventDefault();

                var formulaire = this;
                var confirmation = document.getElementById("confirmation");

                if (!formulaire.reportValidity()) {
                    return;
                }

                confirmation.textContent =
                    "Formulaire validé. Dans cette version statique, le message n'est pas envoyé.";
                confirmation.className = "alert alert-success mb-0";

                formulaire.reset();
            });
    </script>
</body>
</html>
